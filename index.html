<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 — Kamu Nyasar, Bestie</title>
<style>
:root{--sky:#65b8e8;--sand:#ead4a7;--ink:#183448;--cream:#fffdf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101820;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:14px}.site{width:min(1240px,100%);min-height:min(760px,calc(100vh - 28px));position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(to bottom,var(--sky) 0 34%,#e9d3a6 34% 100%);box-shadow:0 24px 80px #0005}.topbar{height:48px;background:#12202b;color:#dce8ef;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#8ca0ad;display:block}.scene{position:absolute;inset:48px 0 0;overflow:hidden}.sun{position:absolute;width:72px;height:72px;border-radius:50%;background:#ffe9a8;right:14%;top:10%;box-shadow:0 0 0 15px #ffe9a822}.cloud{position:absolute;top:15%;left:12%;width:120px;height:25px;background:#ffffff45;border-radius:99px}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;bottom:0}.cloud:before{width:40px;height:40px;left:18px}.cloud:after{width:30px;height:30px;left:55px}.dune{position:absolute;left:-10%;right:-10%;height:200px;border-radius:50% 50% 0 0/28% 28% 0 0;bottom:4%;background:#d7bc85;transform:rotate(-2deg)}.dune.back{bottom:18%;height:140px;left:28%;background:#dfc795;transform:rotate(3deg)}.ruin{position:absolute;right:11%;bottom:31%;width:250px;height:105px;background:#c5a978;clip-path:polygon(8% 18%,70% 18%,100% 100%,0 100%);opacity:.9}.big404{position:absolute;z-index:2;left:6%;top:9%;font-size:clamp(6rem,15vw,11rem);line-height:.85;font-weight:1000;letter-spacing:-.09em;color:#fff;text-shadow:5px 6px 0 #326f8c55}.speech{position:absolute;z-index:4;left:7%;top:43%;width:min(330px,39%);background:var(--cream);padding:22px 25px;border-radius:17px;box-shadow:0 8px 0 #bca77855;font-size:clamp(1.05rem,2.2vw,1.55rem);font-weight:800;line-height:1.38}.speech:after{content:"";position:absolute;right:-20px;top:35px;border-width:14px 0 14px 22px;border-style:solid;border-color:transparent transparent transparent var(--cream)}.speech small{display:block;font-size:.65em;line-height:1.5;margin-top:12px;color:#687b83;font-weight:650}.person{position:absolute;z-index:3;left:47%;bottom:19%;width:190px;height:280px;animation:float 3s ease-in-out infinite}.hood{position:absolute;inset:0 0 48px;background:#4e352b;clip-path:polygon(17% 8%,37% 0,50% 8%,70% 0,88% 10%,100% 30%,94% 66%,76% 80%,70% 100%,30% 100%,24% 80%,6% 66%,0 30%);border-radius:35%}.face{position:absolute;left:29%;top:26%;width:42%;height:43%;background:#ffc4a0;border-radius:45% 45% 40% 40%}.fringe{position:absolute;left:28%;top:23%;width:44%;height:22%;background:#181514;border-radius:60% 60% 20% 20%}.eye{position:absolute;top:46%;width:10px;height:15px;background:#392a2a;border-radius:50%}.eye.left{left:21%}.eye.right{right:21%}.mouth{position:absolute;left:44%;top:70%;width:13px;height:3px;background:#9d5750;border-radius:8px}.body{position:absolute;left:20%;right:20%;bottom:0;height:47%;background:#3b2925;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);border-radius:20px 20px 8px 8px}.arm{position:absolute;top:53%;width:30%;height:15px;background:#4e352b;border-radius:99px}.arm.left{left:0;transform:rotate(25deg)}.arm.right{right:0;transform:rotate(-28deg)}.boot{position:absolute;bottom:-2px;width:48px;height:16px;background:#1c2020;border-radius:70% 20% 20% 20%}.boot.left{left:29%}.boot.right{right:29%}.label{position:absolute;z-index:3;right:6%;bottom:8%;transform:rotate(5deg);color:#6c5a40;font-weight:900;font-size:1rem;text-align:center}.label span{display:block;font-size:2rem}.bottom{position:absolute;z-index:5;bottom:22px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:end;gap:20px;color:#4f5e64;font-size:.85rem}.bottom strong{display:block;font-size:1rem;color:#273f49;margin-bottom:4px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:13px 18px;font-weight:800;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.primary{background:#153f55;color:white;box-shadow:0 5px 0 #0e2e40}.secondary{background:#fffaf0;color:#274758;box-shadow:0 5px 0 #c8b88f}.toast{position:absolute;z-index:8;left:50%;bottom:92px;transform:translate(-50%,15px);background:#12202b;color:#fff;padding:12px 17px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;max-width:85%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}@media(max-width:700px){body{padding:0}.site{min-height:100svh;border-radius:0}.topbar{height:42px}.scene{inset:42px 0 0}.big404{top:6%;left:6%;font-size:6.4rem}.speech{top:27%;left:5%;width:54%;padding:14px;font-size:1rem}.speech:after{right:-14px;border-width:10px 0 10px 16px}.person{width:145px;height:220px;left:auto;right:8%;bottom:26%}.ruin{right:-4%;bottom:42%;transform:scale(.75);transform-origin:right}.dune{bottom:15%;height:190px}.dune.back{bottom:30%}.label{right:5%;bottom:21%;font-size:.8rem}.label span{font-size:1.4rem}.bottom{bottom:0;left:0;right:0;padding:17px;background:#fff9eced;display:block}.bottom .note{margin-bottom:14px}.actions{display:grid;grid-template-columns:1fr 1fr}.btn{justify-content:center;padding:12px 9px;font-size:.86rem}.toast{bottom:155px}}@media(prefers-reduced-motion:reduce){.person{animation:none}.btn,.toast{transition:none}}
</style></head><body><main class="site"><header class="topbar"><span>NOT FOUND DEPARTMENT</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></header><section class="scene" aria-label="Ilustrasi halaman error 404"><div class="sun"></div><div class="cloud"></div><div class="dune back"></div><div class="ruin"></div><div class="dune"></div><div class="big404">404</div><div class="speech" id="speech">Bukan halaman yang kamu cari.<small>Tenang, bukan kamu doang yang sering salah jalan.</small></div><div class="person" role="img" aria-label="Karakter berjubah yang kebingungan"><div class="hood"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div><div class="fringe"></div><div class="arm left"></div><div class="arm right"></div><div class="body"></div><div class="boot left"></div><div class="boot right"></div></div><div class="label"><span>¯\_(ツ)_/¯</span>aku cuma penjaga<br>halaman kosong</div><div class="toast" id="toast" role="status" aria-live="polite"></div><footer class="bottom"><div class="note"><strong>Sepertinya kamu tersesat.</strong><span id="footerText">URL-nya yakin benar, atau cuma modal percaya diri?</span></div><div class="actions"><a class="btn primary" href="/" id="homeBtn">⌂ Kembali ke beranda</a><button class="btn secondary" id="roastBtn" type="button">✦ Sindir aku lagi</button></div></footer></section></main><script>
const roasts=[['Bukan halaman yang kamu cari.','Tenang, bukan kamu doang yang sering salah jalan.','URL-nya yakin benar, atau cuma modal percaya diri?'],['404. Bahkan Google pun menyerah.','Halaman ini menghilang dengan penuh kesadaran.','Kamu nyasar dengan niat, atau memang bakat?'],['Wah, berani juga klik link ini.','Sayangnya, keberanianmu tidak dibalas halaman.','Coba cek URL-nya. Jangan cuma cek keberuntungan.'],['Halaman ini sedang cuti.','Dia melihat URL-mu lalu memilih work-life balance.','Kami juga ingin membantu, tapi ya… ini 404.'],['Kamu menemukan sesuatu!','Sayangnya cuma halaman kosong. Selamat, ya.','Quest gagal: halaman tidak ditemukan.']];let i=0;const speech=document.getElementById('speech'),foot=document.getElementById('footerText'),toast=document.getElementById('toast');document.getElementById('roastBtn').addEventListener('click',()=>{i=(i+1)%roasts.length;speech.innerHTML=roasts[i][0]+'<small>'+roasts[i][1]+'</small>';foot.textContent=roasts[i][2];toast.textContent='Sindiran diperbarui. Halamannya tetap nggak ada. 🙂';toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)});document.getElementById('homeBtn').addEventListener('click',e=>{if(location.pathname==='/'||location.pathname==='/index.html'){e.preventDefault();toast.textContent='Ini sudah beranda… kalau situsmu memang dipasang di root. 😅';toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}});
</script></body></html>
